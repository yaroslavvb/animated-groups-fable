<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>632 playback WebGL tests</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:20px}canvas{width:128px;height:128px;margin:4px}li{margin:10px 0}.pass{color:#176d47}.fail{color:#a22}</style><h1>632 playback WebGL tests</h1><p id="status">Running…</p><ol id="results"></ol><div id="canvases"></div><script type="module">

      for(let y=0;y<64;y++)for(let x=0;x<64;x++)for(let c=0;c<4;c++){const difference=Math.abs(pixels[((63-y)*64+x)*4+c]-expected[(y*64+x)*4+c]);maximum=Math.max(maximum,difference);total+=difference;}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Plume in black and white only. A verified Gray–Scott rotating wave, drawn as the region where the pattern exceeds its own half-turn image: a quarter turn with a quarter-period shift reproduces the animation, and a half turn or a half-period shift reverses black and white.">
  <title>Plume Monochrome — Rotating wave</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="Plume Monochrome — Black and white rotating wave">
  <meta property="og:description" content="Only black and white, turning in step. Rotate it a half turn, or wait half a period, and black and white swap places.">
  <meta property="og:url" content="https://plume-monochrome.pages.dev/">
  <meta property="og:image" content="https://plume-monochrome.pages.dev/social-preview.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A repeating black-and-white lattice of curling plumes, captured from the Plume Monochrome animation.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Plume Monochrome — Black and white rotating wave">
  <meta name="twitter:description" content="Only black and white, turning in step. Rotate it a half turn, or wait half a period, and black and white swap places.">
  <meta name="twitter:image" content="https://plume-monochrome.pages.dev/social-preview.jpg">
  <meta name="twitter:image:alt" content="A repeating black-and-white lattice of curling plumes, captured from the Plume Monochrome animation.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
  <main aria-label="Plume Monochrome rotating wave lattice">
    <canvas id="pattern" data-style="monochrome" aria-label="Animated black-and-white lattice of rotating waves. Drag to pan, pinch or scroll to zoom. Press Space to pause or F for fullscreen."></canvas>
    <div id="notice" role="status">Loading Plume Monochrome…</div>
    <div id="controls" aria-label="Animation controls">
      <span class="name">Plume Monochrome</span>
      <button id="pause" type="button" aria-label="Pause animation" title="Pause · Space" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="pause-icon" d="M8 5v14M16 5v14"/></svg>
      </button>
      <button id="reset" type="button" aria-label="Reset view" title="Reset view · 0" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="1.6"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
      <button id="fullscreen" type="button" aria-label="Enter fullscreen" title="Fullscreen · F" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="fullscreen-icon" d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg>
        <span id="fullscreen-label">Fullscreen</span>
      </button>
    </div>
    <div id="stats" hidden aria-live="off"></div>
    <noscript>This animation needs JavaScript and WebGL. Enable JavaScript and reload to view it.</noscript>
  </main>
  <script type="module" src="./app.mjs"></script>
</body>
</html>

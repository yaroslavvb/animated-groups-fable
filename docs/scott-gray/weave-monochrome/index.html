<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Only black and white, woven. Slide this Gray–Scott rotating wave half a cell and black and white change places; slide it half a cell both ways and nothing changes.">
  <title>Weave Monochrome — Slide it half a cell and the colours swap</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="Weave Monochrome — Black and white woven rotating wave">
  <meta property="og:description" content="A twill that turns once per period. Slide it half a cell, turn it upside down, or wait half a period, and black and white change places.">
  <meta property="og:url" content="https://weave-monochrome.pages.dev/">
  <meta property="og:image" content="https://weave-monochrome.pages.dev/social-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A black-and-white twill of interlacing strands, captured from the Weave Monochrome animation.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Weave Monochrome — Black and white woven rotating wave">
  <meta name="twitter:description" content="A twill that turns once per period. Slide it half a cell, turn it upside down, or wait half a period, and black and white change places.">
  <meta name="twitter:image" content="https://weave-monochrome.pages.dev/social-preview.png">
  <meta name="twitter:image:alt" content="A black-and-white twill of interlacing strands, captured from the Weave Monochrome animation.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
  <main aria-label="Weave Monochrome woven rotating wave lattice">
    <canvas id="pattern" aria-label="Animated black-and-white twill of interlacing strands, turning once per period. Drag to pan, pinch or scroll to zoom, two fingers to turn. Keys: Space pauses, F is fullscreen, S shows frame statistics, 0 or Home resets the view, plus and minus zoom, square brackets turn, and the arrow keys pan."></canvas>
    <div id="notice" role="status">Loading Weave Monochrome…</div>
    <div id="controls" aria-label="Animation controls">
      <button class="name" type="button" aria-pressed="false" title="Frame statistics · S">Weave Monochrome</button>
      <button id="pause" type="button" aria-label="Pause animation" title="Pause · Space" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="pause-icon" d="M8 5v14M16 5v14"/></svg>
      </button>
      <button id="reset" type="button" aria-label="Reset view" title="Reset view · 0" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="1.6"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
      <button id="fullscreen" type="button" aria-label="Enter fullscreen" title="Fullscreen · F" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="fullscreen-icon" d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg>
        <span id="fullscreen-label">Fullscreen</span>
      </button>
    </div>
    <div id="stats" hidden aria-live="off"></div>
    <noscript>This animation needs JavaScript and WebGL. Enable JavaScript and reload to view it.</noscript>
  </main>
  <script type="module" src="./app.mjs"></script>
</body>
</html>

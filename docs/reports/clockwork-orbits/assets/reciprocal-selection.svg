<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 532" width="1200" height="532" role="img">
<style>
  svg{
    --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
    --surface:#fcfcfb; --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100;
    --c7:#4a3aa7; --faint:#f1f0ec;
  }
  @media (prefers-color-scheme: dark){
    svg{
      --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#4a4a46;
      --surface:#1a1a19; --c1:#5b9ff0; --c2:#f0814f; --c3:#3ac394; --c4:#dba21f;
      --c7:#9085e9; --faint:#242422;
    }
  }
  svg text{ font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        fill: var(--ink); }
  svg .t-title{ font-size:19px; font-weight:600; }
  svg .t-sub{ font-size:14.5px; fill: var(--ink2); }
  svg .t-lab{ font-size:14px; }
  svg .t-small{ font-size:12.5px; fill: var(--ink2); }
  svg .t-tiny{ font-size:11.5px; fill: var(--muted); }
  svg .t-mono{ font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12.5px; }
  svg .node{ fill: var(--axis); }
  svg .tile{ fill:none; stroke: var(--axis); stroke-width:1.1; opacity:0.8; }
  svg .cell{ fill:none; stroke: var(--ink2); stroke-width:2.2; }
  svg .p3{ fill: var(--c1); fill-opacity:0.13; stroke: var(--ink); stroke-width:1.9;
       stroke-dasharray:8 5; }
  svg .dom{ fill: var(--c4); fill-opacity:0.34; stroke: var(--ink); stroke-width:2.4; }
  svg .e0{ stroke: var(--c1); stroke-width:5.5; stroke-linecap:round; fill:none; }
  svg .e1{ stroke: var(--c2); stroke-width:5.5; stroke-linecap:round; fill:none; }
  svg .e2{ stroke: var(--c7); stroke-width:5.5; stroke-linecap:round; fill:none; }
  svg .g0{ fill: var(--c1); }
  svg .g1{ fill: var(--c2); }
  svg .g2{ fill: var(--c7); }
  svg .ring{ fill: none; stroke-width:2.4; }
  svg .arrow{ fill:none; stroke: var(--ink2); stroke-width:1.5; }
</style>
<rect width="1200" height="532" fill="none"/>
<text x="40.0" y="40.0" class="t-title" text-anchor="start" style="">Three of the six shortest waves survive the clockwork character</text>
<text x="40.0" y="64.0" class="t-sub" text-anchor="start" style="">g227, first temporal harmonic. Every member of a reciprocal shell has to be tested: within one shell some survive and some cancel to nothing.</text>
<defs><marker id="akLive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L9.5,5 L0,9.5 z" fill="var(--c2)"/></marker><marker id="akDead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L9.5,5 L0,9.5 z" fill="var(--muted)"/></marker></defs>
<circle cx="318" cy="320" r="169.0" fill="none" stroke="var(--grid)" stroke-width="1" stroke-dasharray="3 5"/>
<circle cx="318" cy="320" r="98.0" fill="none" stroke="var(--grid)" stroke-width="1"/>
<circle cx="149.0" cy="320.0" r="4.5" fill="none" stroke="var(--muted)" stroke-width="1.6"/>
<text x="129.0" y="324.0" class="t-tiny" text-anchor="middle" style="">(-2,1)</text>
<circle cx="233.5" cy="466.4" r="4.5" fill="none" stroke="var(--muted)" stroke-width="1.6"/>
<text x="223.5" y="487.7" class="t-tiny" text-anchor="middle" style="">(-1,-1)</text>
<circle cx="233.5" cy="173.6" r="4.5" fill="none" stroke="var(--muted)" stroke-width="1.6"/>
<text x="223.5" y="160.3" class="t-tiny" text-anchor="middle" style="">(-1,2)</text>
<circle cx="402.5" cy="466.4" r="4.5" fill="none" stroke="var(--muted)" stroke-width="1.6"/>
<text x="412.5" y="487.7" class="t-tiny" text-anchor="middle" style="">(1,-2)</text>
<circle cx="402.5" cy="173.6" r="4.5" fill="none" stroke="var(--muted)" stroke-width="1.6"/>
<text x="412.5" y="160.3" class="t-tiny" text-anchor="middle" style="">(1,1)</text>
<circle cx="487.0" cy="320.0" r="4.5" fill="none" stroke="var(--muted)" stroke-width="1.6"/>
<text x="507.0" y="324.0" class="t-tiny" text-anchor="middle" style="">(2,-1)</text>
<text x="318.0" y="117.0" class="t-small" text-anchor="middle" style="">the next ring — all six cancel</text>
<line x1="318" y1="320" x2="402.9" y2="271.0" stroke="var(--c2)" stroke-width="3.0" marker-end="url(#akLive)" opacity="1"/>
<text x="428.9" y="256.0" class="t-lab" text-anchor="middle" style="fill:var(--c2);font-weight:600">(1,0)</text>
<text x="428.9" y="273.0" class="t-tiny" text-anchor="middle" style="">h+2ℓ ≡ 1</text>
<text x="428.9" y="289.0" class="t-tiny" text-anchor="middle" style="fill:var(--c2)">0.5774</text>
<line x1="318" y1="320" x2="233.1" y2="271.0" stroke="var(--c2)" stroke-width="3.0" marker-end="url(#akLive)" opacity="1"/>
<text x="207.1" y="256.0" class="t-lab" text-anchor="middle" style="fill:var(--c2);font-weight:600">(-1,1)</text>
<text x="207.1" y="273.0" class="t-tiny" text-anchor="middle" style="">h+2ℓ ≡ 1</text>
<text x="207.1" y="289.0" class="t-tiny" text-anchor="middle" style="fill:var(--c2)">0.5774</text>
<line x1="318" y1="320" x2="318.0" y2="418.0" stroke="var(--c2)" stroke-width="3.0" marker-end="url(#akLive)" opacity="1"/>
<text x="318.0" y="448.0" class="t-lab" text-anchor="middle" style="fill:var(--c2);font-weight:600">(0,-1)</text>
<text x="318.0" y="465.0" class="t-tiny" text-anchor="middle" style="">h+2ℓ ≡ 1</text>
<text x="318.0" y="481.0" class="t-tiny" text-anchor="middle" style="fill:var(--c2)">0.5774</text>
<line x1="318" y1="320" x2="318.0" y2="222.0" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#akDead)" opacity="0.65"/>
<text x="318.0" y="192.0" class="t-lab" text-anchor="middle" style="fill:var(--muted);font-weight:400">(0,1)</text>
<text x="318.0" y="209.0" class="t-tiny" text-anchor="middle" style="">h+2ℓ ≡ 2</text>
<text x="318.0" y="225.0" class="t-tiny" text-anchor="middle" style="fill:var(--muted)">0.0000</text>
<line x1="318" y1="320" x2="233.1" y2="369.0" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#akDead)" opacity="0.65"/>
<text x="207.1" y="384.0" class="t-lab" text-anchor="middle" style="fill:var(--muted);font-weight:400">(-1,0)</text>
<text x="207.1" y="401.0" class="t-tiny" text-anchor="middle" style="">h+2ℓ ≡ 2</text>
<text x="207.1" y="417.0" class="t-tiny" text-anchor="middle" style="fill:var(--muted)">0.0000</text>
<line x1="318" y1="320" x2="402.9" y2="369.0" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#akDead)" opacity="0.65"/>
<text x="428.9" y="384.0" class="t-lab" text-anchor="middle" style="fill:var(--muted);font-weight:400">(1,-1)</text>
<text x="428.9" y="401.0" class="t-tiny" text-anchor="middle" style="">h+2ℓ ≡ 2</text>
<text x="428.9" y="417.0" class="t-tiny" text-anchor="middle" style="fill:var(--muted)">0.0000</text>
<circle cx="318" cy="320" r="3" fill="var(--ink2)"/>
<text x="640.0" y="112.0" class="t-small" text-anchor="start" style="font-weight:600">The rule</text>
<text x="640.0" y="142.0" class="t-title" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--c2)">h + 2ℓ ≡ 1   (mod 3)</text>
<text x="640.0" y="174.0" class="t-tiny" text-anchor="start" style="">g227 contains a translation by (1/3, 2/3) carrying τ = 2/3.</text>
<text x="640.0" y="190.0" class="t-tiny" text-anchor="start" style="">Projecting the plane wave exp(ik·x) onto that character multiplies</text>
<text x="640.0" y="206.0" class="t-tiny" text-anchor="start" style="">its star by a cube root of unity, and the star cancels identically</text>
<text x="640.0" y="222.0" class="t-tiny" text-anchor="start" style="">unless the residue is 1.</text>
<text x="640.0" y="250.0" class="t-small" text-anchor="start" style="font-weight:600">What the six shortest waves do</text>
<text x="640.0" y="272.0" class="t-tiny" text-anchor="start" style="">(1,0), (0,−1), (−1,1) survive, each with projection norm 0.5774;</text>
<text x="640.0" y="288.0" class="t-tiny" text-anchor="start" style="">(−1,0), (0,1), (1,−1) give exactly 0.0000. The survivors sit at 120°</text>
<text x="640.0" y="304.0" class="t-tiny" text-anchor="start" style="">to one another — the three-wave star that becomes the seed.</text>
<text x="640.0" y="332.0" class="t-small" text-anchor="start" style="font-weight:600">The next ring cancels completely</text>
<text x="640.0" y="354.0" class="t-tiny" text-anchor="start" style="">Every member of the second shell has h + 2ℓ ≡ 0, and the measured</text>
<text x="640.0" y="370.0" class="t-tiny" text-anchor="start" style="">projection norm of the whole shell is 2.1e−16. Taking “the first</text>
<text x="640.0" y="386.0" class="t-tiny" text-anchor="start" style="">shell vector” naively gives exactly zero: every member has to be</text>
<text x="640.0" y="402.0" class="t-tiny" text-anchor="start" style="">tested.</text>
<text x="640.0" y="430.0" class="t-small" text-anchor="start" style="font-weight:600">And the ring after that is a dial</text>
<text x="640.0" y="452.0" class="t-tiny" text-anchor="start" style="">The third shell survives again, at |k|² = 0.1303 against 0.0328 —</text>
<text x="640.0" y="468.0" class="t-tiny" text-anchor="start" style="">four times larger — and seeding from it converges to a genuine,</text>
<text x="640.0" y="484.0" class="t-tiny" text-anchor="start" style="">unpublished g227 orbit with 24 vortices per cell instead of 6, T =</text>
<text x="640.0" y="500.0" class="t-tiny" text-anchor="start" style="">6.3513842322.</text>
</svg>

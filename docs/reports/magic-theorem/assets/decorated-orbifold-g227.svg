<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 532" width="1200" height="532" role="img">
<style>
  svg{
    --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
    --surface:#fcfcfb; --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100;
    --c7:#4a3aa7; --faint:#f1f0ec;
  }
  @media (prefers-color-scheme: dark){
    svg{
      --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#4a4a46;
      --surface:#1a1a19; --c1:#5b9ff0; --c2:#f0814f; --c3:#3ac394; --c4:#dba21f;
      --c7:#9085e9; --faint:#242422;
    }
  }
  svg text{ font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        fill: var(--ink); }
  svg .t-title{ font-size:19px; font-weight:600; }
  svg .t-sub{ font-size:14.5px; fill: var(--ink2); }
  svg .t-lab{ font-size:14px; }
  svg .t-small{ font-size:12.5px; fill: var(--ink2); }
  svg .t-tiny{ font-size:11.5px; fill: var(--muted); }
  svg .t-mono{ font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12.5px; }
  svg .node{ fill: var(--axis); }
  svg .tile{ fill:none; stroke: var(--axis); stroke-width:1.1; opacity:0.8; }
  svg .cell{ fill:none; stroke: var(--ink2); stroke-width:2.2; }
  svg .p3{ fill: var(--c1); fill-opacity:0.13; stroke: var(--ink); stroke-width:1.9;
       stroke-dasharray:8 5; }
  svg .dom{ fill: var(--c4); fill-opacity:0.34; stroke: var(--ink); stroke-width:2.4; }
  svg .e0{ stroke: var(--c1); stroke-width:5.5; stroke-linecap:round; fill:none; }
  svg .e1{ stroke: var(--c2); stroke-width:5.5; stroke-linecap:round; fill:none; }
  svg .e2{ stroke: var(--c7); stroke-width:5.5; stroke-linecap:round; fill:none; }
  svg .g0{ fill: var(--c1); }
  svg .g1{ fill: var(--c2); }
  svg .g2{ fill: var(--c7); }
  svg .ring{ fill: none; stroke-width:2.4; }
  svg .arrow{ fill:none; stroke: var(--ink2); stroke-width:1.5; }
</style>
<rect width="1200" height="532" fill="none"/>
<text x="40.0" y="40.0" class="t-title" text-anchor="start" style="">The decorated orbifold of g227</text>
<text x="40.0" y="64.0" class="t-sub" text-anchor="start" style="">the plane divided by g227’s rotations is a sphere with three cone points of order 3 — Conway’s 333 turnover.</text>
<text x="40.0" y="84.0" class="t-sub" text-anchor="start" style="">The clockwork symbol r33₁3₂ decorates each cone point with a time offset, and the offset forces a winding.</text>
<path d="M321.0,203.0 Q246.8,286.2 211.9,392.0 Q321.0,414.7 430.1,392.0 Q395.2,286.2 321.0,203.0 Z" fill="none" stroke="var(--axis)" stroke-width="1.5" stroke-dasharray="7 5"/>
<path d="M310.0,212.0 Q235.8,295.2 200.9,401.0 Q310.0,423.7 419.1,401.0 Q384.2,295.2 310.0,212.0 Z" fill="var(--c4)" fill-opacity="0.13" stroke="var(--ink2)" stroke-width="2"/>
<text x="506.0" y="216.0" class="t-tiny" text-anchor="middle" style="">the turnover has two faces:</text>
<text x="506.0" y="232.0" class="t-tiny" text-anchor="middle" style="">the triangle and its double</text>
<path d="M295.0,238.0 A30,30 0 0 0 340.0,212.0" fill="none" stroke="var(--c1)" stroke-width="1.8" marker-end="url(#ah2)"/>
<circle cx="310.00" cy="212.00" r="9.02" style="fill:var(--c1)"/>
<text x="310.0" y="104.0" class="t-title" text-anchor="middle" style="fill:var(--c1)">3</text>
<text x="310.0" y="124.0" class="t-lab" text-anchor="middle" style="">τ = 0</text>
<text x="310.0" y="142.0" class="t-tiny" text-anchor="middle" style="">turn only</text>
<text x="310.0" y="160.0" class="t-small" text-anchor="middle" style="fill:var(--c1);font-weight:600">forces w = 0</text>
<path d="M230.9,401.0 A30,30 0 0 0 185.9,375.0" fill="none" stroke="var(--c2)" stroke-width="1.8" marker-end="url(#ah2)"/>
<polygon points="200.88,412.00 190.76,394.18 211.00,394.18" style="fill:var(--c2)"/>
<text x="186.9" y="445.0" class="t-title" text-anchor="middle" style="fill:var(--c2)">3₁</text>
<text x="186.9" y="465.0" class="t-lab" text-anchor="middle" style="">τ = 1/3</text>
<text x="186.9" y="483.0" class="t-tiny" text-anchor="middle" style="">turn, then wait T/3</text>
<text x="186.9" y="501.0" class="t-small" text-anchor="middle" style="fill:var(--c2);font-weight:600">forces w = −1</text>
<path d="M404.1,375.0 A30,30 0 0 0 404.1,427.0" fill="none" stroke="var(--c7)" stroke-width="1.8" marker-end="url(#ah2)"/>
<polygon points="419.12,390.00 409.00,407.82 429.24,407.82" style="fill:var(--c7)"/>
<text x="433.1" y="445.0" class="t-title" text-anchor="middle" style="fill:var(--c7)">3₂</text>
<text x="433.1" y="465.0" class="t-lab" text-anchor="middle" style="">τ = 2/3</text>
<text x="433.1" y="483.0" class="t-tiny" text-anchor="middle" style="">turn, then wait 2T/3</text>
<text x="433.1" y="501.0" class="t-small" text-anchor="middle" style="fill:var(--c7);font-weight:600">forces w = +1</text>
<defs><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--ink2)"/></marker></defs>
<text x="640.0" y="118.0" class="t-lab" text-anchor="start" style="font-weight:600">What the decoration has to satisfy</text>
<text x="640.0" y="152.0" class="t-small" text-anchor="start" style="font-weight:600">Conway’s magic theorem — the geometry</text>
<text x="640.0" y="178.0" class="t-lab" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace">(1 − 1/3) + (1 − 1/3) + (1 − 1/3)  =  2</text>
<text x="640.0" y="200.0" class="t-tiny" text-anchor="start" style="">cost exactly 2: the orbifold is Euclidean, so the symbol tiles the</text>
<text x="640.0" y="216.0" class="t-tiny" text-anchor="start" style="">plane.</text>
<text x="640.0" y="244.0" class="t-small" text-anchor="start" style="font-weight:600">The temporal residue — the choreography</text>
<text x="640.0" y="270.0" class="t-lab" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace">0/3 + 1/3 + 2/3  =  1  ∈  ℤ</text>
<text x="640.0" y="292.0" class="t-tiny" text-anchor="start" style="">apply the time offset τ, a homomorphism, to γ₁γ₂γ₃ = 1. Holds for</text>
<text x="640.0" y="308.0" class="t-tiny" text-anchor="start" style="">all 68 catalogue entries (values 0, 1, 2).</text>
<text x="640.0" y="336.0" class="t-small" text-anchor="start" style="font-weight:600">The index budget — what the animation must contain</text>
<text x="640.0" y="362.0" class="t-lab" text-anchor="start" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace">0/3 + (−1)/3 + (+1)/3  =  0</text>
<text x="640.0" y="384.0" class="t-tiny" text-anchor="start" style="">the windings the cone points force sum to zero over one cell: six</text>
<text x="640.0" y="400.0" class="t-tiny" text-anchor="start" style="">vortices, three of each sign, all pinned.</text>
<text x="640.0" y="436.0" class="t-small" text-anchor="start" style="">At an order-n centre whose +2π/n generator carries τ = k/n, the first temporal harmonic</text>
<text x="640.0" y="454.0" class="t-small" text-anchor="start" style="">vanishes unless jk ≡ 0 (mod n) and winds by w ≡ −jk (mod n): the clock sets the vortex.</text>
</svg>

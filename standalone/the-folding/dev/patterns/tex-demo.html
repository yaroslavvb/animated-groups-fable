  dev/patterns/tex-demo.html — the proof, on a real GPU, of the renderer's third print mode (src/render3d.js, mode 3:
  a shape print handed over as a signed-distance texture of one lattice cell).

  A flat square sheet [-1, 1]^2 (uv = xy; two triangles, or a grid) carries a SYNTHETIC shape print whose exact signed
  distance is known: per cell of a SKEW lattice a disc, a ring, a thin bar and a small disc, placed so that the ring
  crosses a border of the cell, the bar another, and the small disc lies over a corner. The texture is computed here from
  that formula. The page then reads the canvas back and compares every pixel with the analytic print:
    tone      from three pictures of the same view (the print; all light; all dark): the pixel's colour is exactly
              mix(light, dark, tone) whatever the lighting, so tone = (C - A0).(A1 - A0) / |A1 - A0|^2
    paper     the paper point under a pixel, and the paper under one pixel step: from the camera's matrices
    expected  sdfTone(sd, sdfFootprint(...), range) of render3d.js on the ANALYTIC sd and gradient (the JS twin)
  Driven by dev/patterns/tex-demo.mjs (numbers as JSON, pictures as PNG). By hand: open it and drag.
    tex-demo.html[?size=256][&range=4][&how=exact|baked|raster][&mesh=grid|two|roll][&az=0][&el=90][&z=0.75][&side=back][&px=600]
      size   texels a side          range  where the texture saturates, in texels of the e1 direction
      how    the texture: the exact formula; the same shapes as polygons baked by src/sdf.js; a control from a 0/1 raster
      z      css px per texel in the middle of the picture (1: one texel is one css px)
  window.__tex = { ready, error, info, focus, place(view), measure(), seamShift(view), tiny(), meshes(view), lose(view),
                   picture(view, opts), contact(), setTex(size, range, how), setMesh(kind), stats(), R }
    measure    one view against the analytic print: far pixels, the ramp across an outline, the JS twin, the cells' borders
    seamShift  the same view from a texture whose cell begins half a cell further on: the two pictures must be the same
    tiny       the sheet small on the screen, turning: its mean tone and its flicker against the ideal and an unfiltered picture
    meshes     two triangles against the grid;  lose: WEBGL_lose_context and back;  picture / contact: PNGs to look at

    const C = { sd: 0, sdTex: 0, sdPx: 0, w: 0, exp: 0, expTex: 0, clean: false, border: false };

    const rnd = prng(seed);

      valid, dim,

      twin: { n: bandN, rms: r4(Math.sqrt(se / Math.max(1, bandN))), p99: r4(errs[Math.floor(0.99 * (errs.length - 1))] || 0), max: r4(maxE), rmsTex: r4(Math.sqrt(seTex / Math.max(1, bandN))), rmsIso: r4(Math.sqrt(seIso / Math.max(1, bandN))), rmsTexIso: r4(Math.sqrt(seTexIso / Math.max(1, bandN))) },

  }

  /**
   * The print small on the screen, while the view turns: `frames` pictures, `stepDeg` apart in azimuth, of a sheet

   * over the pixel's own patch of paper (6 x 6 points): the true share of dark (ideal), the same of the saturating ramp

  /**
   * No seam, the sharp way: the same print from a second texture whose cell begins half a cell further on, so that the
   * borders of ITS cells run through other parts of the picture. With a power-of-two size the two textures hold the

   * wrap, the mip level, the filter) the two pictures are the same. Returns the difference of the tone, pixel by pixel:
   * the largest and the rms over the whole sheet, and over the pixels within 1 px of a border of either texture.

  /**
   * What it costs to hand over ANOTHER field of size x size texels: the first frame with it (the upload and its mip

  /**
   * The same view with the sheet as two triangles and as a grid: the largest difference of any colour channel (0..255)
   * over the pixels inside the sheet, 3 px off its rim (worst), and over the whole canvas (worstAll: along the rim the

  }

  /** Lose the WebGL context and have it restored; the picture before and after, and the uploads the restore cost. */

  /** A picture of a view in the paper's own colours, as a PNG data URL of the canvas's device pixels (or a crop, blown

  const shot = document.getElementById('shot'), sheetCv = document.getElementById('sheet');

    R.setStyle(meas ? MEAS : PAPER);

    place({ az: num('az', 0), el: num('el', q.get('side') === 'back' ? -90 : 90), z: num('z', 0.75) });
    R.render();
    // the camera of this page against the renderer's own projection
    let worstProj = 0;
    for (const p of [[0, 0], [0.5, -0.3], [-0.9, 0.9], [0.31, 0.77]]) {
      const a = R.project([p[0], p[1], 0]), o = unproj(a[0] * dpr, H - a[1] * dpr, [0, 0]);
      worstProj = Math.max(worstProj, Math.hypot(o[0] - p[0], o[1] - p[1]));
    }
    out.info.unprojectError = worstProj;
    Object.assign(out, { place, measure, tiny, meshes, seamShift, uploadCost, lose, picture, contact, setTex, setMesh, sdAt, stats: () => ({ ...R.stats, styleCalls }), R });
    document.getElementById('note').textContent = `${out.info.gpu} · texture ${out.info.size} x ${out.info.size}, range ${out.info.rangeTexels} texels · ${out.info.mesh} · dpr ${dpr} · anisotropic x${out.info.anisoUsed}`;
  } catch (e) { out.error = String(e && e.stack || e); document.getElementById('note').textContent = 'ERROR ' + out.error; }
  out.ready = true;
</script>

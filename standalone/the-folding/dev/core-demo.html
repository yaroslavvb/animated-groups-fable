<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>core demo — tile, mesh, pieces</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; color: #1a1a1f; font: 13px/1.3 system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<canvas id="c"></canvas>
<script type="module">
// core-demo.html — diagnostic view of src/domain.js + src/mesh.js (core agent).
//   ?g=<id>&preset=<i>&amp=<0..1>[&seed=x,y][&density=N][&zoom=1][&wire=0]      one group
//   ?sheet=1[&amp=1][&preset=i]                                                 all 17 groups in a grid
// Draws: copies of the tile under the group (thin grey; orientation-reversing copies tinted), the tile's mesh
// coloured by piece, hinge segments (teal), the boundary in its glue-class colours (mirrors in ink), cone points, the seed.
import { GROUPS, BY_ID, elementsNear } from '../src/groups.js';
import { apply, det } from '../src/geom.js';
import { makeWarp, buildDomain } from '../src/domain.js';
import { buildMesh } from '../src/mesh.js';
import { INK, FAINT, ACCENT, HAIRLINE, CLASS_COLORS, MIRROR_COLOR, classColor } from '../src/palette.js';

let q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, Hh = 0;
function resetCanvas() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; Hh = window.innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(Hh * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, Hh);
}

// pieces use the palette in another order than the glue classes, so piece 0 / 1 are not mistaken for class 0 / 1
const PIECE = ['#3D4C8F', '#5C7D12', '#B5489C', '#8C6D1F', '#56B4E9', '#7A5CC7', '#E69F00', '#0072B2'];
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };

function build(group, presetIndex, amp, seedOverride, density) {
  const p = group.presets[Math.min(presetIndex, group.presets.length - 1)];
  const warp = makeWarp(group, amp);
  let domain, mesh, ms = Infinity;
  // what a rebuild costs while the seed is dragged: domain + mesh with the warp in hand; best of four (the first is cold)
  for (let k = 0; k < 4; k++) {
    const t0 = performance.now();
    domain = buildDomain(group, { seed: seedOverride || p.seed, metric: p.metric, warp });
    mesh = buildMesh(group, domain, density ? { density } : {});
    ms = Math.min(ms, performance.now() - t0);
  }
  return { group, preset: p, domain, mesh, ms };
}

/** Draw one scene into the rectangle (x, y, w, h); the world window is centred at (cx, cy) with half-width `half`. */
function draw(scene, x, y, w, h, cx, cy, half, opts = {}) {
  const { group, domain, mesh } = scene;
  const s = Math.min(w, h) / (2 * half);
  const X = (wx) => x + w / 2 + (wx - cx) * s, Y = (wy) => y + h / 2 - (wy - cy) * s;
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  const outline = domain.outline(Math.sqrt(group.domainArea) / 48);
  const pt = [0, 0];

  // copies of the tile
  const rad = half * Math.hypot(w, h) / Math.min(w, h) + 2 * Math.sqrt(group.domainArea);
  for (const g of elementsNear(group, cx, cy, rad, domain.seed[0], domain.seed[1])) {
    ctx.beginPath();
    let first = true;
    for (const o of outline) {
      for (let i = 0; i < o.pts.length; i += 2) {
        apply(g, o.pts[i], o.pts[i + 1], pt);
        if (first) { ctx.moveTo(X(pt[0]), Y(pt[1])); first = false; } else ctx.lineTo(X(pt[0]), Y(pt[1]));
      }
    }
    ctx.closePath();
    if (det(g) < 0) { ctx.fillStyle = 'rgba(26,26,31,0.05)'; ctx.fill(); }
    ctx.strokeStyle = FAINT; ctx.lineWidth = 0.8; ctx.stroke();
  }

  // mesh, coloured by piece
  const { xy, tri, triCell } = mesh;
  for (let pass = 0; pass < (opts.wire === false ? 1 : 2); pass++) {
    for (let p = 0; p < mesh.cells.length; p++) {
      ctx.beginPath();
      for (let t = 0; t < mesh.m; t++) {
        if (triCell[t] !== p) continue;
        const a = tri[3 * t], b = tri[3 * t + 1], c = tri[3 * t + 2];
        ctx.moveTo(X(xy[2 * a]), Y(xy[2 * a + 1])); ctx.lineTo(X(xy[2 * b]), Y(xy[2 * b + 1])); ctx.lineTo(X(xy[2 * c]), Y(xy[2 * c + 1])); ctx.closePath();
      }
      const col = PIECE[p % PIECE.length];
      if (pass === 0) { ctx.fillStyle = rgba(col, p === mesh.root ? 0.30 : 0.18); ctx.fill(); } else { ctx.strokeStyle = rgba(col, 0.55); ctx.lineWidth = 0.4; ctx.stroke(); }
    }
  }

  // hinges
  ctx.lineCap = 'round';
  for (const cr of mesh.creases) {
    ctx.beginPath(); ctx.moveTo(X(cr.pts[0]), Y(cr.pts[1])); ctx.lineTo(X(cr.pts[2]), Y(cr.pts[3]));
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.stroke();
    ctx.strokeStyle = ACCENT; ctx.lineWidth = 2.6; ctx.stroke();
  }

  // boundary: glue-class colours, mirrors in ink; a dot per boundary sample coloured by its piece (checks boundary.cells)
  for (const bnd of mesh.boundary) {
    ctx.beginPath();
    for (let i = 0; i < bnd.pts.length; i += 2) { if (i === 0) ctx.moveTo(X(bnd.pts[i]), Y(bnd.pts[i + 1])); else ctx.lineTo(X(bnd.pts[i]), Y(bnd.pts[i + 1])); }
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#fff'; ctx.lineWidth = opts.small ? 5.5 : 7.5; ctx.stroke();
    ctx.strokeStyle = bnd.kind === 'mirror' ? MIRROR_COLOR : classColor(bnd.cls);
    ctx.lineWidth = opts.small ? 3 : 4.5; ctx.stroke();
  }
  if (!opts.small) {
    for (const bnd of mesh.boundary) {
      for (let j = 0; j < bnd.cells.length; j++) {
        ctx.beginPath(); ctx.arc(X(bnd.pts[2 * j]), Y(bnd.pts[2 * j + 1]), 1.6, 0, 7);
        ctx.fillStyle = '#fff'; ctx.fill();
        ctx.beginPath(); ctx.arc(X(bnd.pts[2 * j]), Y(bnd.pts[2 * j + 1]), 1.1, 0, 7);
        ctx.fillStyle = PIECE[bnd.cells[j] % PIECE.length]; ctx.fill();
      }
    }
    // direction of gluing: an arrow at 1/4 of each cut edge and at the matching place of its partner
    domain.edges.forEach((e, i) => {
      if (e.kind !== 'cut') return;
      const t = e.partner === i ? 0.25 : (i < e.partner ? 0.3 : (e.rev ? 0.7 : 0.3));
      const a = domain.edgePoint(i, t), b = domain.edgePoint(i, t + (i < e.partner || !e.rev ? 0.04 : -0.04));
      const ang = Math.atan2(-(b[1] - a[1]), b[0] - a[0]);
      ctx.save(); ctx.translate(X(a[0]), Y(a[1])); ctx.rotate(ang);
      ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-5, 6); ctx.lineTo(-5, -6); ctx.closePath();
      ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = classColor(e.cls); ctx.lineWidth = 1.6; ctx.stroke();
      ctx.restore();
    });
  }

  // cone points and the seed
  for (const c of domain.conePoints) {
    ctx.beginPath(); ctx.arc(X(c.x), Y(c.y), opts.small ? 3 : 5, 0, 7);
    ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke();
    if (!opts.small) { ctx.fillStyle = INK; ctx.font = '11px system-ui'; ctx.fillText(String(c.order), X(c.x) + 7, Y(c.y) - 6); }
  }
  const sd = domain.warp.fwd(domain.seed[0], domain.seed[1]);
  ctx.beginPath(); ctx.arc(X(sd[0]), Y(sd[1]), opts.small ? 3.5 : 6, 0, 7); ctx.fillStyle = ACCENT; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}

function caption(scene) {
  const { group, mesh, domain, preset, ms } = scene;
  return `${group.label}  ${group.hm} · ${preset.name} · ${domain.poly.length} edges, ${domain.classes} classes · ${mesh.m} tri, ${mesh.cells.length} piece${mesh.cells.length === 1 ? '' : 's'} · ${ms.toFixed(1)} ms`;
}

function tileWindow(scene, margin) {
  const b = scene.mesh.bbox;
  return { cx: (b[0] + b[2]) / 2, cy: (b[1] + b[3]) / 2, half: margin * Math.max(b[2] - b[0], b[3] - b[1]) / 2 };
}

/** Render the view described by a query string (the page's own by default); returns the statistics. */
function show(search) {
  if (search !== undefined) q = new URLSearchParams(search);
  resetCanvas();
  const amp = Math.max(0, Math.min(1, parseFloat(q.get('amp') || '0')));
  const stats = [];
  if (q.get('sheet')) {
    const cols = W >= 900 ? 6 : 3, rows = Math.ceil(17 / cols);
    const cw = W / cols, ch = Hh / rows;
    GROUPS.forEach((group, i) => {
      const scene = build(group, parseInt(q.get('preset') || '0', 10), amp);
      const x = (i % cols) * cw, y = Math.floor(i / cols) * ch;
      const win = tileWindow(scene, 1.5);
      draw(scene, x + 2, y + 18, cw - 4, ch - 20, win.cx, win.cy, win.half, { small: true, wire: q.get('wire') !== '0' });
      ctx.save();
      ctx.beginPath(); ctx.rect(x, y, cw - 2, 18); ctx.clip();          // captions never run into the next panel
      ctx.fillStyle = INK; ctx.font = '600 13px system-ui';
      ctx.fillText(group.label, x + 6, y + 14);
      ctx.fillStyle = '#52514a'; ctx.font = '11px system-ui';
      const note = cw < 220 ? `${scene.mesh.m} tri · ${scene.mesh.cells.length} pc` : `${scene.preset.name} · ${scene.mesh.m} tri · ${scene.mesh.cells.length} pc · ${scene.ms.toFixed(1)} ms`;
      ctx.fillText(note, x + 6 + ctx.measureText(group.label).width + 22, y + 14);
      ctx.restore();
      ctx.strokeStyle = HAIRLINE; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, cw - 1, ch - 1);
      stats.push({ id: group.id, tri: scene.mesh.m, pieces: scene.mesh.cells.length, ms: +scene.ms.toFixed(2) });
    });
  } else {
    const group = BY_ID[q.get('g') || '333'] || BY_ID['333'];
    const seed = q.get('seed') ? q.get('seed').split(',').map(Number) : null;
    const scene = build(group, parseInt(q.get('preset') || '0', 10), amp, seed, parseInt(q.get('density') || '0', 10) || undefined);
    const win = q.get('zoom') ? tileWindow(scene, parseFloat(q.get('zoom')) > 0 ? 1.15 / parseFloat(q.get('zoom')) + 0.0 : 1.15)
      : { cx: group.center[0], cy: group.center[1], half: group.viewHalf };
    draw(scene, 0, 24, W, Hh - 24, win.cx, win.cy, win.half, { wire: q.get('wire') !== '0' });
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, 24);
    ctx.fillStyle = INK; ctx.font = '13px system-ui';
    ctx.fillText(caption(scene) + ` · amp ${amp}`, 8, 16);
    stats.push({ id: group.id, tri: scene.mesh.m, pieces: scene.mesh.cells.length, ms: +scene.ms.toFixed(2),
      tree: scene.mesh.cells.map((c) => c.parent), areas: scene.mesh.cells.map((c) => +c.area.toFixed(5)) });
  }
  return stats;
}
window.__core = { ready: true, show, stats: show() };
</script>

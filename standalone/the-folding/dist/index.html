<body>
<div class="app" id="app">

  <header class="hdr" id="header">
    <h1 class="title">The Folding</h1>
    <button type="button" class="orb" id="chip" aria-haspopup="dialog" title="Pick an orbifold">
      <span class="orb-symbol" id="chip-symbol"></span>
      <span class="orb-meta" id="chip-meta"></span>
      <svg class="orb-caret" viewBox="0 0 10 6" aria-hidden="true" focusable="false"><path d="M0 0h10L5 6z"/></svg>
    </button>
  </header>

  <p class="caption" id="caption" aria-live="polite"></p>

  <main class="stage" id="stage" data-ss-thumb>

    <section class="pane pane-plane" id="pane-plane" data-ss-comments="off" aria-label="Plane: the pattern, its symmetry and the cut">
      <canvas id="plane-canvas"></canvas>
      <p class="hint" id="hint">drag to move the cut</p>
    </section>

    <div class="ctl ctl-plane" id="plane-controls">
      <div class="presets" id="presets" role="group" aria-label="Cut"></div>
      <label class="wavy" id="wavy-field">
        <span class="wavy-label">Wavy</span>
        <span class="scrub" data-scrub>
          <span class="scrub-rail"></span>
          <input type="range" id="wavy" min="0" max="1" step="0.01" value="0">
        </span>
      </label>
      <p class="cut-note" id="cut-note">Every edge is a mirror: Fold folds the plane onto the tile.</p>
    </div>

    <section class="pane pane-fold" id="pane-fold" data-ss-comments="off" aria-label="Fold: the tile closing up into the orbifold">
      <canvas id="fold-canvas"></canvas>
      <div class="labels" id="fold-labels" aria-hidden="true"></div>
      <p class="hint turn-hint" id="turn-hint">drag to turn</p>
    </section>

    <div class="ctl ctl-fold" id="fold-controls">
      <button type="button" class="btn-primary" id="fold-btn"><span data-label>Fold</span></button>
      <div class="scrub" id="scrub" data-scrub>
        <span class="scrub-rail"></span>
        <span class="scrub-fill"></span>
        <span class="scrub-ticks" id="scrub-ticks" data-ticks></span>
        <input type="range" id="scrubber" min="0" max="1" step="any" value="0" aria-label="Fold progress">
      </div>
      <button type="button" class="btn-quiet" id="reset-view" aria-label="Reset view" title="Reset view">
        <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M4.4 6.8A6.5 6.5 0 1 0 10 3.5"/><path d="M12.7 1 10 3.5l2.7 2.6"/></svg>
        <span class="btn-text">Reset<span class="btn-text-wide"> view</span></span>
      </button>
    </div>

  </main>

  <footer class="legend" id="legend" aria-label="Legend">
    <span class="lg" data-feature="seams"><svg class="sw" viewBox="0 0 24 8" width="24" height="8" aria-hidden="true" focusable="false"><path class="sw-a" d="M1.5 4h9"/><path class="sw-b" d="M13.5 4h9"/></svg><span>coloured = edges sewn together</span></span>
    <span class="lg" data-feature="mirrors"><svg class="sw" viewBox="0 0 14 8" width="14" height="8" aria-hidden="true" focusable="false"><path class="sw-ink" d="M1.5 4h11"/></svg><span>ink = mirror (becomes the rim)</span></span>
    <span class="lg" data-feature="cones"><svg class="sw" viewBox="0 0 8 8" width="8" height="8" aria-hidden="true" focusable="false"><circle class="sw-dot" cx="4" cy="4" r="3"/></svg><span>dot <i>n</i> = cone point</span></span>
    <span class="lg" data-feature="corners"><svg class="sw" viewBox="0 0 10 10" width="10" height="10" aria-hidden="true" focusable="false"><circle class="sw-ring" cx="5" cy="5" r="3.7"/></svg><span>ring ∗<i>n</i> = mirror corner</span></span>
    <span class="lg" data-feature="double"><svg class="sw" viewBox="0 0 24 8" width="24" height="8" aria-hidden="true" focusable="false"><path class="sw-dash" d="M1.5 4h21"/></svg><span>dashed = self-intersection</span></span>
    <span class="companion"><span class="companion-k">companion:</span> <a href="https://spacesheep.dev/@yaroslavvb/the-unfolding" target="_blank" rel="noopener">The Unfolding</a></span>
  </footer>

</div>

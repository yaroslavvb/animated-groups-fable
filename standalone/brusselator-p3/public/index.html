<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Spiral Lattice — Brusselator p3</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="Spiral Lattice — An endless Brusselator wave">
  <meta property="og:description" content="A lattice of ember-coloured spirals pulsing in threefold symmetry. Open it fullscreen and watch it loop.">
  <meta property="og:url" content="https://brusselator-p3-spiral.mathornament.workers.dev/">
  <meta property="og:image" content="https://brusselator-p3-spiral.mathornament.workers.dev/social-preview.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A repeating ember-coloured lattice with threefold symmetry, captured from the Spiral Lattice animation.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Spiral Lattice — An endless Brusselator wave">
  <meta name="twitter:description" content="A lattice of ember-coloured spirals pulsing in threefold symmetry. Open it fullscreen and watch it loop.">
  <meta name="twitter:image" content="https://brusselator-p3-spiral.mathornament.workers.dev/social-preview.jpg">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
  <main aria-label="Spiral Lattice">
    <canvas id="pattern" aria-label="Animated ember lattice with threefold symmetry. Drag to pan, pinch or scroll to zoom, twist with two fingers to turn. Press Space to pause or F for fullscreen."></canvas>
    <div id="notice" role="status">Loading Spiral Lattice…</div>
    <div id="controls" aria-label="Animation controls">
      <span class="name">Spiral Lattice</span>
      <button id="pause" type="button" aria-label="Pause animation" title="Pause · Space" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="pause-icon" d="M8 5v14M16 5v14"/></svg>
      </button>
      <button id="reset" type="button" aria-label="Reset view" title="Reset view · 0" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="1.6"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
      <button id="fullscreen" type="button" aria-label="Enter fullscreen" title="Fullscreen · F" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="fullscreen-icon" d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg>
        <span id="fullscreen-label">Fullscreen</span>
      </button>
    </div>
    <div id="stats" hidden aria-live="off"></div>
    <noscript>This animation needs JavaScript and WebGL. Enable JavaScript and reload to view it.</noscript>
  </main>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
